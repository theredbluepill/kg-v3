# The cha22 anchor setup (owner, 2026-09-30): PPO against the FIXED bot Cha22
# instead of mirror self-play, under owner term M, 4 ranks.
# Owner, verbatim, in order: "OK, for fixed bot, we can use cha22 (check
# ~/kaggriculture-v2).", "can we acceleerate this setup?", "implement the new
# rewrad first before we revisit the cha22 anchor setup." and, after term M was
# launched, "is anchor thing ready?".
# Interpretation (orchestrating agent, not owner adoption): the run tests
# whether this RL pipeline improves on BC at all, and it uses term M.
# Identical to configs/kaggriculture_4rank_margin.yaml (J/2's recipe: halved
# recipe-J LRs muon_lr 1e-4 / adamw_lr 5e-6, checkpoint_freq 10M,
# native_threads 4; reward 0.5 x cash difference + 0.5 x terminal sign, econ
# shaping and term A off) except:
# - env.opponent_mix {bot: cha22, fraction: 1.0}: every env of every rank hosts
#   Cha22 in one seat; the learned seat is (env + episode) mod 2, and a learner
#   mask keeps the bot's seat out of every loss term, advantage normalization
#   and denominator. Collection mix only: the bot's name never reaches model
#   inputs, losses, rewards, normalization or checkpoint selection; it is a W&B
#   summary label (opponent_mix/bot).
# - The warm start is the BC best, not J/2's final checkpoint:
#   --load-model-weights /root/bc-best/checkpoint_bc_best.pt
#   (sha256 fd8545872aca59c70e273e9655055e1104cd719588364f463ae87b0d488e6f51)
#   --load-model-weights-mode model_only
#   so the optimizer and the LR warm-up start fresh and the last_best teacher
#   starts at the BC best.
# Telemetry: train/*_vs_bot per update (win rate, own/opponent bank, margin,
# games) and, at every checkpoint_freq, a fixed-bot evaluation in both seats
# (eval/*_vs_bot, eval/*_vs_bot_seat_{0,1}) beside the last-best evaluation
# that alone drives promotion.
# Limits: nothing trained with this preset at commit time; one seed; the
# throughput of Cha22 stepping at 64 envs per rank and the fixed-bot evaluation
# wall time are unmeasured; Cha22 is parity-qualified at the default game
# configuration only (light three-game corpus). See
# cookbook/decisions/train-ppo-against-a-fixed-opponent-with-a-learner-mask.md.
#
# The margin preset's header follows for provenance.
# Owner term M: J/2's recipe with the reward 0.5 x cash difference + 0.5 x
# terminal sign (+1/-1/0), 4 ranks.
# Owner, 2026-09-30, verbatim: "can we relaunch (before anchor) run, fix the
# reward, 0.5 Cash Diff (add this in) + 0.5 (Terminal loss 1/-1/0)?" and
# "implement the new rewrad first before we revisit the cha22 anchor setup."
# Reproduces the effective config of J/2 (control-J2-4rank-20260930, W&B
# spoon/kg-v3 nw3klj2s, run dir 20260930-010131: kaggriculture_4rank.yaml with
# -o optimizer.muon_lr=0.0001 optimizer.adamw_lr=0.000005
# rl.checkpoint_freq=10000000 env.native_threads=4) except the reward:
# - env.reward_shaping.econ_shaping 0.2 -> 0 (death/drought shaping off);
# - econ_bank_weight/econ_bank_cap stay 0 (own-bank term A off);
# - econ_margin_weight 0.5, econ_margin_scale 50000.0, econ_margin_cap 0.5, so
#   terminal_scale is 1 - .5 = 0.5.
# Per step each seat gets m(after) - m(before) with
# m = clamp(.5 * (bank_self - bank_opp) / 50000, -.5, .5); zero-sum. A game's
# return from the reset state is m(final margin) + .5 * sign(final margin),
# within [-1, 1]. A mid-game return-to-go subtracts m(margin_t), so it spans
# [-1.5, 1.5], outside the winner critic's (-1, 1): a known, unmeasured limit.
# Scale: agent-proposed from the live run hz4bpjnq (self-play |margin| mean
# 10-18k, p50 8-13k): typical games stay linear and saturate only at
# |margin| >= 50k. Not owner-given or measured optimal.
# Launch as J2-resume-r0208 did: a warm start from J/2's checkpoint_final.pt
# with --load-model-weights-mode model_and_optimizer.
# Limits: one seed; untrained at commit time.
#
# The J/2-era halved recipe-J preset (kaggriculture_4rank_bc_finetune_bank.yaml)
# supplied the body below; its header follows for provenance.
#
# Recipe J halved with absolute own-bank shaping (owner term A), 4 ranks.
# Identical to configs/kaggriculture_4rank_bc_finetune.yaml except:
# - optimizer.muon_lr 0.0002 -> 0.0001 and optimizer.adamw_lr 1e-5 -> 5e-6
#   (recipe J halved; same warm-up and cosine schedule);
# - env.reward_shaping.econ_bank_weight 0 -> 0.25 and econ_bank_cap 0 -> 0.25
#   (econ_bank_scale stays 100000.0), so terminal_scale is 1 - .25 - .25 = 0.5;
# - rl.checkpoint_freq stays the owner's 10_000_000.
# Owner, 2026-09-30, verbatim: "A is good + decrease the LR by half?", answering
# option "A. Absolute bank shaping: a small per-step reward for own bank growth
# ... capped like the other terms" and halving the recipe-J learning rates.
# Per step, each seat gets min(.25, .25 * max(0, own bank) / 100000) after
# minus before, own seat only (not zero-sum), telescoping to the final minus the
# reset-bank score (3,000 scores .0075). The score saturates at a bank of
# 100,000: a 70k bank scores .175, so the term moves across the whole observed
# 73k -> 5.7k slide. The zero-sum winner critic (2p - 1 per seat) cannot
# represent the common-mode part of this term (logged as
# train/return_common_mean beside train/return_zero_sum_abs_mean).
# Provenance of the values: the owner gave none. After the owner's answer the
# agent proposed "S = 100,000, w_b = 1.0, cap_b = 0.25" with the consequences
# "A 70k final bank earns +0.175 and 100k+ earns the full +0.25"; w_b = 1.0
# contradicts those consequences (it saturates at 25k), so the implementer set
# w_b = 0.25, which realises them. The owner has not confirmed the numbers.
#
# Evidence: the 4-rank main run J (W&B spoon/kg-v3 gq94cyyp; kg/rebuild-pod4-evidence
# c0b551f, ops/rebuild-2026-09-29/pod4-2026-09-30/main-J-4rank/launch.md) held
# own_bank_mean at about 72-74k up to iteration 34, then fell to 17.9k at
# iteration 68 and 5.7k at iteration 79, just after the LR peak (iteration 63).
# The relative-only reward pays nothing for a shared slide into poverty in
# mirror self-play. Limits: one seed; LR, objective and teacher weight are not
# separated; nothing here has been trained; the values are agent-proposed, not
# owner-given or measured optima. See
# cookbook/decisions/add-absolute-own-bank-shaping-and-halve-the-recipe-j-learning-rates.md.
#
# The base preset's header follows.
# Recipe J: the BC fine-tune preset for 4 ranks. Identical to
# configs/kaggriculture_4rank.yaml except both learning rates / 10
# (optimizer.muon_lr 0.002 -> 0.0002, optimizer.adamw_lr 1e-4 -> 1e-5; the same
# warm-up and cosine schedule), like the 2- and 8-rank presets. Launch it from
# the BC best with the BC critic head kept:
#   --load-model-weights <checkpoint_bc_best.pt> --load-model-weights-mode model_only
#
# Added 2026-09-30 as the base of configs/kaggriculture_4rank_bc_finetune_bank.yaml.
# Evidence and limits as in the 2-rank preset (2-rank ablation, kg/pod-ppo-prelanding
# ddcbf84; see cookbook/references/bc-fine-tune-presets-divide-both-learning-rates-by-ten.md).
# The 4-rank main run J (W&B spoon/kg-v3 gq94cyyp; kg/rebuild-pod4-evidence c0b551f,
# ops/rebuild-2026-09-29/pod4-2026-09-30/main-J-4rank/launch.md) ran exactly this
# recipe as kaggriculture_4rank.yaml plus the two LR overrides (and
# env.native_threads=4): rank 0's own_bank_mean fell from about 72-74k (iterations
# 12-34) to 17.9k at iteration 68 and 5.7k at iteration 79, just after the LR
# peak at iteration 63, and the watchdog stopped it. One seed; the cause (LR,
# objective or teacher weight) is not attributed.
#
# The base config's header follows.
# Kaggriculture on Isaiah's scaling_6m recipe (upstream 32b3ec9) for 4 ranks
# (4x RTX PRO 6000). Isaiah's 6M multi-GPU division
# (winner_ce_6m_4x5090.yaml): n_envs and segments_per_minibatch are divided by
# the world size, so the GLOBAL batch
# (256 envs), optimizer steps/iter (16), global segments per optimizer step (16)
# and env steps/iter (16,384) equal scaling_6m; the optimizer, LR schedule, PPO
# coefficients, compile settings and teacher are unchanged; only checkpoint_freq
# differs (halved to 10M by the owner, below).
# seg_per_minibatch * grad_accum stays 4 per rank; the split is set from the
# pre-launch memory smoke (plan Task 6.1; Task 6.3 runs four ranks).
# See cookbook/decisions/recipe-choices-align-to-isaiah-without-owner-escalation.md.
# Loads through FullConfig; run_ppo checks its GEMM workload, then builds the
# native env and trains through the shared PPO path (Task 3.1).
env:
  n_envs: 64
  obs_spec:
    obs_spec: kaggriculture
    schema_version: 3
  action_spec:
    action_spec: kaggriculture
    hire_limit: 241
  reward_mode: win_loss
  # Owner term M (2026-09-30): 0.5 x cash difference + 0.5 x terminal sign.
  # Death/drought shaping (econ_shaping) and own-bank term A are off; their
  # remaining coefficients are inert.
  reward_shaping:
    econ_shaping: 0.0
    econ_starvation_weight: 4.0
    econ_drought_weight: 1.0
    econ_cap: 0.25
    econ_ineffective_weight: 0.0
    econ_ineffective_cap: 0.1
    econ_bank_weight: 0.0
    econ_bank_scale: 100000.0
    econ_bank_cap: 0.0
    # Term M on: clamp(.5 * (bank_self - bank_opp) / 50000, -.5, .5), paid as a
    # per-step potential difference (zero-sum), telescoping to the final
    # margin's score from equal reset banks.
    econ_margin_weight: 0.5
    econ_margin_scale: 50000.0
    econ_margin_cap: 0.5
  pin_memory: true
  # J/2's launch override (env.native_threads=4), made explicit here.
  native_threads: 4
  # The cha22 anchor: every env hosts the fixed bot Cha22 (a collection mix,
  # never a model input).
  opponent_mix:
    bot: cha22
    fraction: 1.0

model: kaggriculture

optimizer:
  optimizer: muon
  adamw_lr: 5.0e-06
  adamw_eps: 1.0e-05
  weight_decay: 0.0
  muon_lr: 0.0001
  muon_weight_decay: 0.01
  muon_momentum: 0.95
  lr_schedule:
    schedule: linear_warmup_cosine_decay
    warmup_steps: 1000
    decay_steps: 400_000
    lr_min_ratio: 0.01

rl:
  horizon: 64
  # Owner decision 2026-09-30 ("cut the interval into half"): 10M global env
  # steps, half of scaling_6m's 20M. A checkpoint and the last-best evaluation
  # (promotion at win rate >= 0.7) share this cadence: at 16,384 env steps per
  # iteration, about every 610 iterations. See
  # cookbook/decisions/halve-the-kaggriculture-checkpoint-interval-to-10m-steps.md.
  checkpoint_freq: 10_000_000
  ppo_epochs: 1
  segments_per_minibatch: 4
  gradient_accumulation_steps: 1
  # gamma=1.0 keeps the critic softmax well-defined
  gamma: 1.0
  gae_lambda: 0.9
  clip_coef: 0.2
  vf_clip_coef: null
  vf_coef: 2.0
  ent_coef: 1e-6
  max_grad_norm: 10.0
  target_kl: null
  ppo_clip_mode: per_player
  normalize_advantages: true
  # scaling_6m saves 8 replays; Kaggriculture replay export is Task 7.3, which
  # restores 8. A positive value fails at startup until then.
  eval_replay_games: 0
  # Teacher (Phase 4.4): scaling_6m's last-best teacher. The teacher is the
  # last-best model, refreshed in place when the student wins >= 0.7 of the
  # evaluation at each checkpoint_freq (10M global env steps). Its targets are
  # precomputed once per update and cached for the whole rollout
  # (837,287,936 B per rank, FP32; run_ppo prints it with the headroom).
  # The teacher checkpoint is a required launch-time input, never a config
  # value: --load-model-weights CHECKPOINT (the BC best) or
  # -o rl.teacher_init=CHECKPOINT; run_ppo rejects a fresh launch without one.
  teacher_mode: last_best
  teacher_kl_coef: 0.005
  teacher_value_coef: 0.005
  # A chunk size of the teacher precompute, not a batch: kept at scaling_6m's
  # 128, not divided by the world size, as in Isaiah's per-rank configs
  # (scaling_3m, scaling_1p5m, winner_ce_6m_4x5090). Per rank the chunk is
  # min(128, 64) = 64 envs: the whole rollout, 8,192 rows, in one precompute call.
  teacher_segments_per_minibatch: 128
  compile_mode: default
  dtype: bfloat16
