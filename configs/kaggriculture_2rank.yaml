# Kaggriculture on Isaiah's scaling_6m recipe (upstream 32b3ec9) for 2 ranks
# (2x RTX PRO 6000). Isaiah's multi-GPU rule (winner_ce_6m_4x5090.yaml): n_envs
# and segments_per_minibatch are divided by the world size, so the GLOBAL batch
# (256 envs), optimizer steps/iter (16), global segments per optimizer step (16)
# and env steps/iter (16,384) equal scaling_6m; the optimizer, LR schedule, PPO
# coefficients, compile settings, teacher and checkpoint cadence are unchanged.
# seg_per_minibatch * grad_accum stays 8 per rank; the split is set from the
# pre-launch memory smoke (plan Task 6.1: spm 4 / accum 2 if spm 8 does not fit).
# See cookbook/decisions/recipe-choices-align-to-isaiah-without-owner-escalation.md.
# Loads through FullConfig once the Kaggriculture env and model join it (Task 3.1).
env:
  n_envs: 128
  obs_spec:
    obs_spec: kaggriculture
    schema_version: 3
  action_spec:
    action_spec: kaggriculture
    hire_limit: 241
  reward_mode: win_loss
  # Economic shaping 0.2 is the owner's choice; the other coefficients are the
  # reference branch's audited reward defaults (plan C8).
  reward_shaping:
    econ_shaping: 0.2
    econ_starvation_weight: 4.0
    econ_drought_weight: 1.0
    econ_cap: 0.25
    econ_ineffective_weight: 0.0
  pin_memory: true
  # Chosen from the measured native step time in Task 6.1.
  native_threads: 2

model: kaggriculture

optimizer:
  optimizer: muon
  adamw_lr: 0.0001
  adamw_eps: 1.0e-05
  weight_decay: 0.0
  muon_lr: 0.002
  muon_weight_decay: 0.01
  muon_momentum: 0.95
  lr_schedule:
    schedule: linear_warmup_cosine_decay
    warmup_steps: 1000
    decay_steps: 400_000
    lr_min_ratio: 0.01

rl:
  horizon: 64
  checkpoint_freq: 20_000_000
  ppo_epochs: 1
  segments_per_minibatch: 8
  gradient_accumulation_steps: 1
  # gamma=1.0 keeps the critic softmax well-defined
  gamma: 1.0
  gae_lambda: 0.9
  clip_coef: 0.2
  vf_clip_coef: null
  vf_coef: 2.0
  ent_coef: 1e-6
  max_grad_norm: 10.0
  target_kl: null
  ppo_clip_mode: per_player
  normalize_advantages: true
  # Kaggriculture replay export is Task 7.3.
  eval_replay_games: 8
  teacher_mode: last_best
  teacher_kl_coef: 0.005
  teacher_value_coef: 0.005
  # A chunk size of the teacher precompute, not a batch: kept, as in Isaiah's
  # per-rank configs (scaling_6m_halfbatch, winner_ce_6m_4x5090).
  teacher_segments_per_minibatch: 128
  compile_mode: default
  dtype: bfloat16
