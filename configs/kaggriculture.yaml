# Local CPU functional config (plan Task 3.5): the kaggriculture_2rank recipe
# shrunk to 2 envs and a tiny model so one iteration runs on a laptop CPU. Not a
# training recipe and not a throughput measurement: FP32, no compilation, no
# replay export. Optimizer, schedule, PPO coefficients and teacher settings are
# scaling_6m's; 2 envs with segments_per_minibatch 1 give 2 optimizer steps/iter.
# Loads through FullConfig; run_ppo checks its GEMM workload, then stops until
# Task 3.1 rollout storage and action mapping land (the native env exists).
env:
  n_envs: 2
  obs_spec:
    obs_spec: kaggriculture
    schema_version: 3
  action_spec:
    action_spec: kaggriculture
    hire_limit: 241
  reward_mode: win_loss
  reward_shaping:
    econ_shaping: 0.2
    econ_starvation_weight: 4.0
    econ_drought_weight: 1.0
    econ_cap: 0.25
    econ_ineffective_weight: 0.0
    econ_ineffective_cap: 0.1
  pin_memory: false
  native_threads: 1

model: kaggriculture_cpu

optimizer:
  optimizer: muon
  adamw_lr: 0.0001
  adamw_eps: 1.0e-05
  weight_decay: 0.0
  muon_lr: 0.002
  muon_weight_decay: 0.01
  muon_momentum: 0.95
  lr_schedule:
    schedule: linear_warmup_cosine_decay
    warmup_steps: 1000
    decay_steps: 400_000
    lr_min_ratio: 0.01

rl:
  horizon: 64
  checkpoint_freq: 1_000
  ppo_epochs: 1
  segments_per_minibatch: 1
  gradient_accumulation_steps: 1
  gamma: 1.0
  gae_lambda: 0.9
  clip_coef: 0.2
  vf_clip_coef: null
  vf_coef: 2.0
  ent_coef: 1e-6
  max_grad_norm: 10.0
  target_kl: null
  ppo_clip_mode: per_player
  normalize_advantages: true
  eval_replay_games: 0
  # scaling_6m's last-best teacher; a fresh launch needs --load-model-weights
  # or -o rl.teacher_init (the teacher checkpoint), or -o rl.teacher_mode=null.
  teacher_mode: last_best
  teacher_kl_coef: 0.005
  teacher_value_coef: 0.005
  teacher_segments_per_minibatch: 128
  compile_mode: null
  model_compile: none
  dtype: float32
