# Recipe J halved with absolute own-bank shaping (owner term A), 8 ranks.
# Identical to configs/kaggriculture_8rank_bc_finetune.yaml except:
# - optimizer.muon_lr 0.0002 -> 0.0001 and optimizer.adamw_lr 1e-5 -> 5e-6
#   (recipe J halved; same warm-up and cosine schedule);
# - env.reward_shaping.econ_bank_weight 0 -> 1.0 and econ_bank_cap 0 -> 0.25
#   (econ_bank_scale stays 100000.0), so terminal_scale is 1 - .25 - .25 = 0.5;
# - rl.checkpoint_freq stays the owner's 10_000_000.
# Owner, 2026-09-30, verbatim: "A is good + decrease the LR by half?", answering
# option "A. Absolute bank shaping: a small per-step reward for own bank growth
# ... capped like the other terms" and halving the recipe-J learning rates.
# Per step, each seat gets min(.25, max(0, own bank) / 100000) after minus
# before, own seat only (not zero-sum), telescoping to the final minus the
# reset-bank score. The score saturates at a bank of 25,000, so above 25k the
# term pays nothing: it guards against the collapse, it does not reward growth
# beyond 25k. The zero-sum winner critic (2p - 1 per seat) cannot represent the
# common-mode part of this term (logged as train/return_common_mean).
#
# Evidence: the 4-rank main run J (W&B spoon/kg-v3 gq94cyyp; kg/rebuild-pod4-evidence
# c0b551f, ops/rebuild-2026-09-29/pod4-2026-09-30/main-J-4rank/launch.md) held
# own_bank_mean at about 72-74k up to iteration 34, then fell to 17.9k at
# iteration 68 and 5.7k at iteration 79, just after the LR peak (iteration 63).
# The relative-only reward pays nothing for a shared slide into poverty in
# mirror self-play. Limits: one seed; LR, objective and teacher weight are not
# separated; nothing here has been trained; the values are the owner's, not
# measured optima. See
# cookbook/decisions/add-absolute-own-bank-shaping-and-halve-the-recipe-j-learning-rates.md.
#
# The base preset's header follows.
# Recipe J: the BC fine-tune preset for 8 ranks. Identical to
# configs/kaggriculture_8rank.yaml except both learning rates / 10
# (optimizer.muon_lr 0.002 -> 0.0002, optimizer.adamw_lr 1e-4 -> 1e-5; the same
# warm-up and cosine schedule). Launch it from the BC best with the BC critic
# head kept:
#   --load-model-weights <checkpoint_bc_best.pt> --load-model-weights-mode model_only
#
# Evidence (2-rank PPO-collapse ablation from the BC best, one seed per arm
# except D/J, pre-landing, not Codex-verified; kg/pod-ppo-prelanding ddcbf84, ops/rebuild-2026-09-29/pod-6000-2026-09-29/ablation/
# comparison.md, attribution.md, final-report.md, ablate-D-lr10-bccritic/ and
# ablate-J-combined/):
# - LR / 10 prevented the collapse in every matched pair (control -> B,
#   H -> D, I -> G: game-4 banks from about 0.1k to 62-84k); every full-LR arm
#   but the anchored one fell below 1k by game 4.
# - The BC critic head (model_only) raised the critic's mean explained variance
#   to 0.84 against <= 0.29 for every fresh-head arm at LR / 10, at two env
#   seeds (D: 0, J: 1,000,000).
# Limits: banks rising above the BC level is NOT established (game 4 - game 1:
# D +11.6k, J -4.8k); every arm ran 46 iterations inside the 1,000-step LR
# warm-up, so the recipe is untested at its 2e-4 peak; self-play banks are not
# strength (no held-out evaluation ran). This departs from Isaiah's scaling_6m
# LRs for a case Isaiah never had (PPO from imitation), for the measured reason
# above; see cookbook/references/bc-fine-tune-presets-divide-both-learning-rates-by-ten.md.
# At 8 ranks the global workload (256 envs, 16 optimizer steps and 16,384 env
# steps per iteration) equals the 2-rank config's, so the per-step learning
# rate transfers by construction. That is reasoning, not an 8-rank
# measurement: no 8-rank PPO run has happened (plan Task 6.3b).
#
# The base config's header follows.
# Kaggriculture on Isaiah's scaling_6m recipe (upstream 32b3ec9) for 8 ranks
# (8x RTX PRO 6000, the owner's likely main-run hardware; 2 ranks stay the
# diagnostics/building pod). Isaiah's 6M multi-GPU division
# (winner_ce_6m_4x5090.yaml):
# n_envs and segments_per_minibatch are divided by the world size, so the GLOBAL
# batch (8 x 32 = 256 envs), optimizer steps/iter (16), global segments per
# optimizer step (8 x 2 = 16) and env steps/iter (16,384) equal scaling_6m; the
# optimizer, LR schedule, PPO coefficients, compile settings and teacher are
# unchanged; only checkpoint_freq differs (halved to 10M by the owner, below).
# seg_per_minibatch * grad_accum stays 2 per rank (accum 1, as Isaiah's per-rank
# configs); plan Task 6.3b qualifies it.
# See cookbook/decisions/recipe-choices-align-to-isaiah-without-owner-escalation.md.
# Loads through FullConfig; run_ppo checks its GEMM workload, then builds the
# native env and trains through the shared PPO path (Task 3.1).
env:
  n_envs: 32
  obs_spec:
    obs_spec: kaggriculture
    schema_version: 3
  action_spec:
    action_spec: kaggriculture
    hire_limit: 241
  reward_mode: win_loss
  # Economic shaping 0.2 is the owner's choice; the other coefficients are the
  # reference branch's audited reward defaults (plan C8).
  reward_shaping:
    econ_shaping: 0.2
    econ_starvation_weight: 4.0
    econ_drought_weight: 1.0
    econ_cap: 0.25
    econ_ineffective_weight: 0.0
    econ_ineffective_cap: 0.1
    # Owner term A (2026-09-30): absolute own-bank shaping, on.
    econ_bank_weight: 1.0
    econ_bank_scale: 100000.0
    econ_bank_cap: 0.25
  pin_memory: true
  # Provisional: Task 6.1 measures the native step time and verifies or resets it.
  native_threads: 2

model: kaggriculture

optimizer:
  optimizer: muon
  adamw_lr: 5.0e-06
  adamw_eps: 1.0e-05
  weight_decay: 0.0
  muon_lr: 0.0001
  muon_weight_decay: 0.01
  muon_momentum: 0.95
  lr_schedule:
    schedule: linear_warmup_cosine_decay
    warmup_steps: 1000
    decay_steps: 400_000
    lr_min_ratio: 0.01

rl:
  horizon: 64
  # Owner decision 2026-09-30 ("cut the interval into half"): 10M global env
  # steps, half of scaling_6m's 20M. A checkpoint and the last-best evaluation
  # (promotion at win rate >= 0.7) share this cadence: at 16,384 env steps per
  # iteration, about every 610 iterations. See
  # cookbook/decisions/halve-the-kaggriculture-checkpoint-interval-to-10m-steps.md.
  checkpoint_freq: 10_000_000
  ppo_epochs: 1
  segments_per_minibatch: 2
  gradient_accumulation_steps: 1
  # gamma=1.0 keeps the critic softmax well-defined
  gamma: 1.0
  gae_lambda: 0.9
  clip_coef: 0.2
  vf_clip_coef: null
  vf_coef: 2.0
  ent_coef: 1e-6
  max_grad_norm: 10.0
  target_kl: null
  ppo_clip_mode: per_player
  normalize_advantages: true
  # scaling_6m saves 8 replays; Kaggriculture replay export is Task 7.3, which
  # restores 8. A positive value fails at startup until then.
  eval_replay_games: 0
  # Teacher (Phase 4.4): scaling_6m's last-best teacher. The teacher is the
  # last-best model, refreshed in place when the student wins >= 0.7 of the
  # evaluation at each checkpoint_freq (10M global env steps). Its targets are
  # precomputed once per update and cached for the whole rollout
  # (418,643,968 B per rank, FP32; run_ppo prints it with the headroom).
  # The teacher checkpoint is a required launch-time input, never a config
  # value: --load-model-weights CHECKPOINT (the BC best) or
  # -o rl.teacher_init=CHECKPOINT; run_ppo rejects a fresh launch without one.
  teacher_mode: last_best
  teacher_kl_coef: 0.005
  teacher_value_coef: 0.005
  # A chunk size of the teacher precompute, not a batch: kept at scaling_6m's
  # 128, not divided by the world size, as in Isaiah's per-rank configs
  # (scaling_3m, scaling_1p5m, winner_ce_6m_4x5090). Per rank the chunk is
  # min(128, 32) = 32 envs: the whole rollout, 4,096 rows, in one precompute call.
  teacher_segments_per_minibatch: 128
  compile_mode: default
  dtype: bfloat16
