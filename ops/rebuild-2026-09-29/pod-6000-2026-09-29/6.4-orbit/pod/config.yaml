env:
  action_spec:
    action_spec: discrete_targets
    max_per_planet_launches: 1
    min_fleet_size: 3
    targeting_mode: anything_goes
  n_envs: 256
  obs_spec:
    max_entities: 320
    obs_spec: entity_based_ext_v2
  pin_memory: true
  reward_mode: win_loss
  two_player_weight: 0.75
model:
  activation: gelu
  actor:
    action_spec: discrete_targets
    entropy_ship_quantiles: 16
    launch_mode: binary
    n_action_mixtures: 4
    scale_max_abs_floor: 8.0
    scale_max_frac: 0.5
    scale_min: 0.1
  critic_mode: softmax
  depth: 6
  embed_dim: 256
  force_flash_attn: true
  lora: null
  mlp_ratio: 2.0
  model_arch: stateless_transformer_v1
  n_heads: 8
  n_scratch_tokens: 4
  player_count_adapter_blocks: 0
  player_count_adapters_enabled: false
  use_learned_pairwise_bias: false
  value_mode: win_loss
optimizer:
  adamw_eps: 1.0e-05
  adamw_lr: 0.0001
  lr_schedule:
    decay_steps: 400000
    lr_min_ratio: 0.01
    schedule: linear_warmup_cosine_decay
    warmup_steps: 1000
  muon_lr: 0.002
  muon_momentum: 0.95
  muon_weight_decay: 0.01
  optimizer: muon
  weight_decay: 0.0
rl:
  checkpoint_freq: 32768
  clip_coef: 0.2
  compile_mode: default
  dtype: bfloat16
  ent_coef: 1.0e-06
  eval_replay_games: 8
  first_minibatch_logratio_limit: 0.05
  gae_lambda: 0.9
  gamma: 1.0
  gradient_accumulation_steps: 1
  horizon: 64
  max_grad_norm: 10.0
  model_compile: trunk
  model_compile_mode: max-autotune-no-cudagraphs
  normalize_advantages: true
  ppo_clip_mode: per_player
  ppo_epochs: 1
  segments_per_minibatch: 16
  target_kl: null
  teacher_init: null
  teacher_kl_coef: 0.005
  teacher_mode: last_best
  teacher_schedule:
    mode: none
  teacher_segments_per_minibatch: 128
  teacher_value_coef: 0.005
  truncation_prob: 0.0
  truncation_step: null
  value_loss: mse
  vf_clip_coef: null
  vf_coef: 2.0
runtime:
  n_runtime_gpus: 1
