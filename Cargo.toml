[package]
name = "owl"
version = "0.1.0"
edition = "2021"

[lib]
name = "rs"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[features]
default = ["fixed-opponents"]
extension-module = ["pyo3/extension-module"]
# Fixed-opponent PPO collection (env.opponent_mix) compiles the imported
# opponents_rs controllers into the extension. Training builds keep it (default);
# the Kaggle submission build passes --no-default-features, because EcoBot/E776
# carry no redistribution license (opponents_rs/README.md).
fixed-opponents = ["dep:kaggriculture-opponents"]

[dependencies]
kaggriculture-engine = { version = "0.1.0", path = "engine_rs" }
kaggriculture-opponents = { version = "0.1.0", path = "opponents_rs", optional = true }
num-bigint = "0.4"
num-traits = "0.2"
numpy = "0.28.0"
# "abi3-py311" tells pyo3 (and maturin) to build using the stable ABI with
# minimum Python version 3.11, matching the Kaggle competition runtime.
pyo3 = { version = "0.28.2", features = ["abi3-py311"] }
rand = "0.10.1"
rayon = "1.12.0"
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "preserve_order"] }

[profile.release]
lto = true
incremental = false
codegen-units = 1

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[build-dependencies]
pyo3-build-config = { version = "0.28.3", features = ["resolve-config"] }

# Native candidate workers catch unwinds before publishing any batch state.
[profile.release.package.kaggriculture-engine]
overflow-checks = true

# Scripted fixed-opponent controllers run inside the native step (env.opponent_mix);
# keep their integer arithmetic checked in release, as in the engine.
[profile.release.package.kaggriculture-opponents]
overflow-checks = true
